name: Reportar archivo incorrecto
description: Informa un problema con un preloader/loader publicado.
title: "[Archivo] "
body:
  - type: input
    id: file
    attributes:
      label: Archivo
      placeholder: preloader_xxx.bin
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Modelo / variante
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware / región
  - type: textarea
    id: problem
    attributes:
      label: Problema observado
      description: Describe qué dato o archivo consideras incorrecto.
    validations:
      required: true
