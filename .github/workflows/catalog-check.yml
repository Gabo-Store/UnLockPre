name: Validate and rebuild catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'scripts/library-index.cjs'
      - 'scripts/check-library.cjs'
      - 'scripts/check-site.cjs'
      - 'package.json'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run catalog:build
      - run: npm test
      - name: Commit regenerated catalog
        run: |
          if git diff --quiet -- downloads/catalog.json; then
            echo "Catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/catalog.json
          git commit -m "chore: rebuild catalog [skip ci]"
          git push
